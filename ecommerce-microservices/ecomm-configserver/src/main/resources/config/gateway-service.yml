server:
  port: 8091
spring:
  cloud:
    config:
      enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/users/**
              filters:
                - "RewritePath=/users(?<segment>/?.*),/api/users${segment}"
            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/products/**
              filters:
                - "RewritePath=/products(?<segment>/?.*),/api/products${segment}"
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/orders/**, /cart/**art, /api/cart/**
              filters:
                - "RewritePath=/(?<segment>/?.*),/api/${segment}"
            - id: eureka-server
              uri: http://localhost:8761
              predicates:
                - Path=/eureka/main
              filters:
                - SetPath=/
            - id: eureka-server-static
              uri: http://localhost:8761
              predicates:
                - Path=/eureka/**
#eureka:
#  client:
#    register-with-eureka: false
#    fetch-registry: true

#logging:
#  level:
#    root: INFO
#    org.springframework.cloud.gateway: TRACE

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability:  1.0

#circuitbreaker
resilience4j:
  circuitbreaker:
    instances:
      ecommCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberofCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slidingWindowType: count_based